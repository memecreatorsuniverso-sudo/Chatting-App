<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
    body {
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      overflow:hidden;
    }

    /* Floating particles background */
    .particles {
      position:absolute;
      width:100%;
      height:100%;
      z-index:1;
      overflow:hidden;
    }

    .particle {
      position:absolute;
      width:10px;
      height:10px;
      background: rgba(255,255,255,0.3);
      border-radius:50%;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) translateX(0) scale(1); }
      50% { transform: translateY(-100vh) translateX(50px) scale(1.5); }
      100% { transform: translateY(0) translateX(-50px) scale(1); }
    }

    /* Form container */
    .login-container {
      position: relative;
      z-index: 2;
      background: rgba(0,0,0,0.7);
      padding: 40px 30px;
      border-radius: 20px;
      width: 320px;
      text-align:center;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      animation: slideIn 1s ease forwards;
    }

    @keyframes slideIn {
      0% { opacity:0; transform: translateY(-50px); }
      100% { opacity:1; transform: translateY(0); }
    }

    h2 {
      color: #fff;
      margin-bottom:30px;
      font-weight:600;
      letter-spacing:1px;
    }

    input {
      width: 100%;
      padding:12px 15px;
      margin-bottom:20px;
      border-radius:10px;
      border:none;
      outline:none;
      font-size:16px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      transition:0.3s;
    }

    input:focus {
      background: rgba(255,255,255,0.2);
      box-shadow: 0 0 10px #ff6ec7;
    }

    button {
      width: 48%;
      padding:12px;
      border:none;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      font-weight:600;
    }

    button[name="action"][value="login"] {
      background: #ff6ec7;
      color:#fff;
      margin-right:4%;
    }

    button[name="action"][value="register"] {
      background: #6ec1ff;
      color:#fff;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,110,199,0.5);
    }

    /* Floating emojis animation */
    .emoji-feedback {
      position:absolute;
      font-size:24px;
      pointer-events:none;
      opacity:0;
      animation: floatUp 1s forwards;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity:1; }
      100% { transform: translateY(-60px); opacity:0; }
    }

  </style>
</head>
<body>

  <div class="particles"></div>

  <div class="login-container">
    <h2>Login / Register</h2>
    <form method="POST" id="loginForm">
      <input name="username" placeholder="Username" required autocomplete="off" />
      <input name="password" type="password" placeholder="Password" required />
      <div style="display:flex; justify-content:space-between;">
        <button name="action" value="login">Login</button>
        <button name="action" value="register">Register</button>
      </div>
    </form>
  </div>

  <script>
    // ---------- Create particles ----------
    const particlesContainer = document.querySelector('.particles');
    const particleCount = 40;
    for(let i=0;i<particleCount;i++){
      const p = document.createElement('div');
      p.classList.add('particle');
      p.style.left = Math.random()*100+'%';
      p.style.top = Math.random()*100+'%';
      p.style.width = (Math.random()*8+2)+'px';
      p.style.height = p.style.width;
      p.style.animationDuration = (Math.random()*8+5)+'s';
      particlesContainer.appendChild(p);
    }

    // ---------- Emoji feedback ----------
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', e => {
      const emojis = ['😎','🔥','💜','✨','🚀'];
      const x = Math.random()*(window.innerWidth-30);
      const y = Math.random()*(window.innerHeight-30);
      const emoji = document.createElement('div');
      emoji.classList.add('emoji-feedback');
      emoji.style.left = x+'px';
      emoji.style.top = y+'px';
      emoji.innerText = emojis[Math.floor(Math.random()*emojis.length)];
      document.body.appendChild(emoji);
      setTimeout(()=> emoji.remove(),1000);
    });
  </script>
</body>
</html>
